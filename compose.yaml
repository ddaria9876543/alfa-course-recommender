
services:
  postgres:
    image: postgres:17
    container_name: alfa_course_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfa_course}
      POSTGRES_USER: ${POSTGRES_USER:-alfa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - alfa_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa_user -d alfa_course"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alfa_postgres_data:
